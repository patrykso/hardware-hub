        @layer utilities {

<body class="bg-background min-h-screen flex items-center justify-center p-container-padding font-body-md text-body-md text-on-surface antialiased">
<!-- Login Card -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-ambient relative overflow-hidden">
<!-- Header Section -->
<header class="flex flex-col items-center mb-stack-lg text-center">
<div class="w-12 h-12 bg-surface-container rounded-lg flex items-center justify-center mb-stack-sm text-primary-container">
<span class="material-symbols-outlined" data-icon="inventory_2" style="font-size: 24px;">inventory_2</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-base tracking-tight">Welcome back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to your account</p>
</header>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-on-surface" for="email">Email (company domain only)</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-on-tertiary-container focus:ring-1 focus:ring-on-tertiary-container transition-all duration-200" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-on-tertiary-container focus:ring-1 focus:ring-on-tertiary-container transition-all duration-200" id="password" name="password" placeholder="Enter your password" required="" type="password">
</div>
</div>
<!-- Submit Action -->
<div class="mt-stack-sm">
<button class="w-full bg-primary-container text-on-primary rounded-lg py-3 font-label-bold text-label-bold hover:bg-on-background active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2" type="submit">
                    Login
                </button>
</div>
</form>
</main>


</body></html>
